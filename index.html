<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>我的ADHD人生</title>
<style>
:root{
  --bg:#1b1f30; --panel:#22273a; --panel2:#2a3048; --line:#3b4363; --navy:#2f3b55; --cream:#fffaf0; --text:#e8efe9; --sub:#a9b8b0;
  --accent:#f0b84a; --good:#7fd08a; --bad:#ef7a6a; --blue:#7fb8e8; --pink:#e99ab8; --purple:#b58ae8; --cyan:#6fe0e0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex}
#stage{position:relative;flex:1;min-width:0;background:#1b1f30;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#brain{width:370px;flex:0 0 370px;background:var(--panel);border-left:2px solid var(--line);overflow-y:auto;padding:8px 10px 14px}
@media (max-aspect-ratio:1/1){
  #app{flex-direction:column}
  #stage{flex:1 1 55%}
  #brain{width:auto;flex:0 0 45%;border-left:none;border-top:2px solid var(--line);padding:6px 8px 10px}
}
/* ---- HUD ---- */
.hudbox{background:var(--cream);border:3px solid var(--navy);border-radius:16px;color:var(--navy);box-shadow:0 3px 0 var(--navy)}
#hudClock{position:absolute;left:8px;top:8px;padding:6px 12px;min-width:130px;max-width:calc(100% - 200px);cursor:pointer;z-index:5}
#hudClock .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudClock .t{font-size:26px;font-weight:800;letter-spacing:2px;color:#e2735c;font-variant-numeric:tabular-nums;line-height:1.1}
#hudClock .t.fuzzy{font-size:20px;letter-spacing:0;color:#7a5ab8}
@media (max-width:480px){#hudClock .t.fuzzy{font-size:16px}#hudBtns button{padding:0 6px}}
#hudClock .s{font-size:12px;color:#5d6b8a;margin-top:2px}
#hudBtns{position:absolute;right:8px;top:8px;display:flex;gap:6px;z-index:5}
#hudBtns button{background:var(--cream);border:3px solid var(--navy);color:var(--navy);border-radius:22px;min-width:46px;height:46px;font-size:15px;font-weight:800;padding:0 12px;box-shadow:0 3px 0 var(--navy)}
#hudBtns button.on{background:#47b8e0;color:#fff}
#ver{position:absolute;right:8px;bottom:4px;font-size:11px;color:#8a9a92;z-index:4;pointer-events:none}
#hyperTag{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#f0b84a;color:#2a1e00;font-weight:800;padding:4px 12px;border-radius:20px;font-size:14px;z-index:5;display:none}
/* ---- dialog ---- */
#dialog{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(760px,calc(100% - 24px));z-index:20;color:#2b2d42;
  background:#fffdf7;border:3px solid var(--navy);border-radius:20px;padding:20px 18px 16px;display:none;cursor:pointer;box-shadow:0 4px 0 var(--navy)}
#dialog .who{position:absolute;top:-15px;left:18px;font-size:14px;font-weight:800;background:#47b8e0;color:#fff;border:3px solid var(--navy);border-radius:20px;padding:1px 12px}
#dialog .txt{font-size:18px;line-height:1.6;white-space:pre-wrap}
#dialog .more{position:absolute;right:16px;bottom:6px;color:#7a8aa8;font-size:13px;animation:blink 1s infinite}
#dialog .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#dialog .choices button{flex:1 1 180px;min-height:48px;font-size:16px;font-weight:700;background:#eef5fb;color:#2b2d42;border:3px solid var(--navy);border-radius:24px;padding:6px 10px}
#dialog .choices button:hover{background:#ffe9a8}
@keyframes blink{50%{opacity:.3}}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:15;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90%}
#toast div{background:var(--cream);color:var(--navy);border:2px solid var(--navy);border-radius:20px;font-weight:700;padding:6px 14px;font-size:15px;animation:toastIn .25s;text-align:center}
#toast div.muffled{opacity:.35;font-size:12px;filter:blur(.6px)}
@keyframes toastIn{from{transform:translateY(-8px);opacity:0}}
/* ---- daydream ---- */
#daydream{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;pointer-events:none;
  background:radial-gradient(circle,rgba(200,210,255,.18),rgba(40,40,70,.55))}
#daydream div{background:#fff;color:#334;border-radius:40px;padding:18px 28px;font-size:20px;font-weight:700;box-shadow:0 0 0 6px rgba(255,255,255,.4);animation:float 2s ease-in-out infinite;max-width:80%;text-align:center}
@keyframes float{50%{transform:translateY(-8px)}}
/* ---- seat bar ---- */
#seatbar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:none;padding:8px 10px 10px;background:linear-gradient(transparent,rgba(27,31,48,.92) 30%)}
#seatbar .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
#seatbar .lbl{font-size:14px;color:var(--sub);width:100%;text-align:center;margin-bottom:4px}
#seatbar button{min-height:52px;min-width:110px;font-size:17px;font-weight:800;border-radius:26px;border:3px solid var(--navy);background:var(--cream);color:var(--navy);padding:6px 16px;touch-action:none;box-shadow:0 3px 0 var(--navy)}
#seatbar button.big{min-width:150px;background:#ffe9a8}
#seatbar button.held{background:#7fd08a;transform:translateY(3px);box-shadow:none}
#seatbar button:disabled{opacity:.4}
#seatbar .prog{width:min(420px,90%);height:14px;background:#2a3330;border:2px solid #4a5a52;border-radius:8px;overflow:hidden;margin:6px auto 0}
#seatbar .prog i{display:block;height:100%;background:var(--good);width:0}
#seatbar .prog.g i{background:var(--cyan)}
#seatbar .proglbl{font-size:12px;color:var(--sub);text-align:center}
/* ---- lab ---- */
#lab{position:absolute;left:50%;top:50%;transform:translate(-50%,-58%);width:min(420px,86%);height:min(300px,52%);z-index:9;display:none;
  background:#f2f8ee;border:4px solid var(--navy);border-radius:20px;overflow:hidden;box-shadow:0 4px 0 var(--navy)}
#lab .leaf{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:150px;opacity:.9}
#lab .pt{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;border:3px solid #e0a020;background:rgba(255,230,120,.55);font-size:22px;display:flex;align-items:center;justify-content:center;animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
#lab .score{position:absolute;left:8px;top:6px;color:#5a3a20;font-weight:800;font-size:16px}
/* ---- QTE ---- */
#qte{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:12;display:none;width:min(420px,88%);
  background:rgba(40,20,20,.95);border:3px solid var(--bad);border-radius:14px;padding:14px;text-align:center}
#qte .q{font-size:18px;margin-bottom:8px;white-space:pre-wrap}
#qte .bar{height:18px;background:#3a2a2a;border-radius:9px;overflow:hidden;margin:8px 0}
#qte .bar i{display:block;height:100%;background:var(--good);width:0}
#qte .tbar i{background:var(--bad)}
#qte button{min-height:58px;width:100%;font-size:20px;font-weight:800;background:#5a2f2f;color:#fff;border:3px solid var(--bad);border-radius:12px;touch-action:none}
#qte button.held{background:#2f5a3a;border-color:var(--good)}
#qte .hint{font-size:13px;color:#e8c8c0;margin-top:6px}
/* ---- touch pad ---- */
#pad{position:absolute;left:12px;bottom:12px;z-index:11;display:none;width:150px;height:150px}
#pad button{position:absolute;width:52px;height:52px;border-radius:12px;background:rgba(30,38,34,.75);border:2px solid #5a6a62;color:#dfe;font-size:22px;touch-action:none}
#pad .u{left:49px;top:0}#pad .d{left:49px;bottom:0}#pad .l{left:0;top:49px}#pad .r{right:0;top:49px}
#actBtn{position:absolute;right:16px;bottom:22px;z-index:11;display:none;width:76px;height:76px;border-radius:50%;background:rgba(240,184,74,.85);border:3px solid #fff3;color:#2a1e00;font-size:17px;font-weight:800;touch-action:none}
#prompt{position:absolute;z-index:6;transform:translate(-50%,-100%);background:var(--cream);color:var(--navy);font-size:13px;font-weight:800;padding:3px 10px;border-radius:14px;pointer-events:none;display:none;white-space:nowrap;border:2px solid var(--navy)}
/* ---- brain panel ---- */
.bh{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.bh b{font-size:16px}
.bh span{font-size:12px;color:var(--sub);text-align:right}
#bcols{display:flex;gap:8px}
.bcol{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.bcol.ghost{border-color:#2f6a6a;background:#1e2e2e}
.ctitle{font-size:13px;font-weight:800;margin-bottom:4px}
.bcol.ghost .ctitle{color:var(--cyan)}
.cloud{position:relative;height:128px;border-radius:10px;background:repeating-linear-gradient(45deg,#2a3530,#2a3530 6px,#283330 6px,#283330 12px);overflow:hidden;margin-bottom:6px}
@media (max-aspect-ratio:1/1){.cloud{height:96px}}
.cloud .cl{position:absolute;left:6px;top:3px;font-size:11px;color:#7f9088}
.cloud .hyper{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:14px;color:#f0d080;text-align:center;padding:8px}
.bub{position:absolute;max-width:72%;background:#fff;color:#2a2a3a;border-radius:16px;padding:6px 10px 8px;font-size:13px;font-weight:700;cursor:pointer;
  box-shadow:0 2px 0 #0003;animation:bubIn .3s, float 2.4s ease-in-out infinite;line-height:1.3;min-height:36px}
.bub.body{background:#ffe4c4}.bub.self{background:#e8d8ff}.bub.lure{background:#fff3a8}
.bub i{position:absolute;left:8px;right:8px;bottom:3px;height:3px;background:#e06050;border-radius:2px;transform-origin:left}
.bub.pop{animation:popOut .25s forwards}
@keyframes bubIn{from{transform:scale(.3);opacity:0}}
@keyframes popOut{to{transform:scale(1.5);opacity:0}}
.gcount{font-size:12px;color:var(--sub);padding:28px 6px 6px}
.mlabel{font-size:12px;color:var(--sub);margin-bottom:4px;display:flex;justify-content:space-between}
.notes{display:flex;flex-direction:column;gap:4px;min-height:30px;position:relative;margin-bottom:6px}
.note{background:#f7e58a;color:#3a3010;border-radius:4px;padding:5px 8px;font-size:13px;font-weight:700;cursor:pointer;transform:rotate(-.6deg);box-shadow:1px 2px 0 #0004;transition:opacity .3s}
.note.done{background:#bfe8a8;text-decoration:line-through}
.note.empty{background:transparent;border:1px dashed #56645d;color:#56645d;box-shadow:none;cursor:default;font-weight:400}
.note.fall{animation:fall 1.2s forwards;position:absolute;left:0;right:0;top:100%;background:#f3c7a0}
@keyframes fall{to{transform:translateY(90px) rotate(25deg);opacity:0}}
.meter{display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0}
.meter .n{width:64px;flex:0 0 64px;color:var(--sub)}
.meter .b{flex:1;height:10px;background:#1a211e;border-radius:5px;overflow:hidden}
.meter .b i{display:block;height:100%;width:0;transition:width .2s}
.meter .v{width:26px;text-align:right;font-variant-numeric:tabular-nums}
.inner{margin-top:6px;font-size:13px;color:#f3e3b8;min-height:20px;font-style:italic}
.gprog{font-size:12px;color:var(--cyan);margin-top:4px}
/* ---- screens ---- */
#screen{position:fixed;inset:0;z-index:50;background:rgba(14,18,16,.97);overflow-y:auto;display:none;padding:20px 16px 40px}
.scr{max-width:720px;margin:0 auto}
.scr h1{font-size:40px;margin:30px 0 4px;text-align:center;color:var(--accent);letter-spacing:2px}
.scr h2{font-size:24px;margin:10px 0 12px;color:var(--accent)}
.scr h3{font-size:18px;margin:18px 0 8px}
.scr p{line-height:1.7;color:#d8e2dc}
.scr .subt{text-align:center;color:var(--sub);margin-bottom:26px}
.mbtn{display:block;width:100%;max-width:420px;margin:10px auto;min-height:54px;font-size:18px;font-weight:700;background:#2f3b35;color:var(--text);border:2px solid #5a6a62;border-radius:12px}
.mbtn.pri{background:#4a3a14;border-color:var(--accent);color:#ffe7b0}
.mbtn:disabled{opacity:.4;cursor:default}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;cursor:pointer}
.slot:hover{border-color:var(--accent)}
.slot small{color:var(--sub)}
.field{margin:16px 0}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field input[type=text]{width:100%;font-size:18px;padding:10px;border-radius:8px;border:2px solid var(--line);background:#111614;color:var(--text);user-select:text;-webkit-user-select:text}
.seg2{display:flex;gap:10px}
.seg2 button{flex:1;min-height:52px;font-size:18px;border-radius:10px;border:2px solid var(--line);background:#2a3430;color:var(--text)}
.seg2 button.on{border-color:var(--accent);background:#4a3a14}
input[type=range]{width:100%;height:36px}
.desc{font-size:14px;color:#cfdad3;background:#222b27;border-radius:8px;padding:8px 10px;margin-top:6px;line-height:1.6}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;line-height:1.7}
.card b{color:var(--accent)}
table.cmp{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
table.cmp th{color:var(--sub);font-weight:400}
table.cmp td.me{color:#ffd9a0;font-weight:700}
table.cmp td.gh{color:var(--cyan)}
table.cmp tr.star td{background:#2c2a14}
.life{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0}
.lnode{width:120px;padding:12px 8px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);text-align:center}
.lnode .i{font-size:34px}.lnode .a{font-size:12px;color:var(--sub)}
.lnode.open{border-color:var(--accent);cursor:pointer}
.lnode.done{border-color:var(--good)}
.lnode.lock{opacity:.45}
.cardtime{text-align:center;margin-top:16vh}
.cardtime .tm{font-size:54px;font-weight:800;color:var(--accent);letter-spacing:4px}
.cardtime .tt{font-size:28px;font-weight:800;margin:6px 0 14px}
.cardtime p{font-size:18px;color:#d0dcd4}
.warn{color:#ffcf8a}
textarea{width:100%;min-height:90px;font-size:13px;background:#111614;color:var(--text);border:2px solid var(--line);border-radius:8px;padding:8px;user-select:text;-webkit-user-select:text}
.disc{font-size:13px;color:var(--sub);border-top:1px solid var(--line);margin-top:20px;padding-top:12px;line-height:1.7}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hudClock" class="hudbox" title="點一下看清楚時間"><div class="t" id="clockT">--:--</div><div class="s" id="clockS"></div></div>
    <div id="hudBtns">
      <button id="btnCmp" title="對照：同步看一般人的狀態（C）">⇄ 對照</button>
      <button id="btnMenu" title="選單（Esc）">⏸</button>
      <button id="btnFull" title="全螢幕">⛶</button>
    </div>
    <div id="hyperTag">🔦 超專注中</div>
    <div id="prompt"></div>
    <div id="daydream"><div id="ddText"></div></div>
    <div id="lab"><div class="leaf">🍃</div><div class="score" id="labScore">發現 0</div></div>
    <div id="qte"><div class="q" id="qteQ"></div>
      <div style="font-size:12px;text-align:left">煞車力</div><div class="bar"><i id="qteP"></i></div>
      <div style="font-size:12px;text-align:left">衝動倒數</div><div class="bar tbar"><i id="qteT"></i></div>
      <button id="qteBtn" data-hold="hold">🤐 忍住！（按住不放）</button>
      <div class="hint" id="qteHint"></div></div>
    <div id="seatbar"></div>
    <div id="toast"></div>
    <div id="dialog"><div class="who" id="dlgWho"></div><div class="txt" id="dlgTxt"></div><div class="choices" id="dlgCh"></div><div class="more" id="dlgMore">▼ 點一下繼續</div></div>
    <div id="pad"><button class="u" data-dir="up">▲</button><button class="d" data-dir="down">▼</button><button class="l" data-dir="left">◀</button><button class="r" data-dir="right">▶</button></div>
    <button id="actBtn">動作</button>
    <div id="ver"></div>
  </div>
  <aside id="brain">
    <div class="bh"><b>🧠 大腦即時畫面</b><span id="bpInfo"></span></div>
    <div id="bcols">
      <section class="bcol" id="colMe">
        <div class="ctitle">你（ADHD）</div>
        <div class="cloud" id="cloudMe"><span class="cl">念頭泡泡（點一下丟掉）</span><div class="hyper" id="hyperMe">🔦 超專注中<br>其他念頭全部消失了……<br>連鐘聲都聽不太到</div></div>
        <div class="mlabel"><span>📝 便利貼（工作記憶）</span><span id="capMe"></span></div>
        <div class="notes" id="notesMe"></div>
        <div id="metersMe"></div>
        <div class="inner" id="innerMe"></div>
      </section>
      <section class="bcol ghost" id="colGh" style="display:none">
        <div class="ctitle">一般的你</div>
        <div class="cloud" id="cloudGh"><span class="cl">念頭泡泡</span><div class="gcount" id="gcount"></div></div>
        <div class="mlabel"><span>📝 便利貼</span><span id="capGh"></span></div>
        <div class="notes" id="notesGh"></div>
        <div id="metersGh"></div>
        <div class="gprog" id="gprog"></div>
      </section>
    </div>
  </aside>
</div>
<div id="screen"></div>

<script>
'use strict';
const VERSION='v0.2';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=m=>{m=Math.floor(m);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const hm=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
const T=16;

/* ================= 音效（Web Audio 合成，零素材） ================= */
const Sound={ctx:null,on:true,
  init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}},
  tone(f,d,type='sine',vol=.15,when=0){if(!this.ctx||!this.on)return;try{const c=this.ctx,t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05)}catch(e){}},
  bell(vol=.16){[659,523,587,392,392,587,659,523].forEach((f,i)=>this.tone(f,.9,'sine',vol,i*.42))},
  blip(){this.tone(880,.06,'square',.04)}, pop(){this.tone(560,.09,'triangle',.08)},
  bad(){this.tone(196,.18,'sawtooth',.06);this.tone(147,.3,'sawtooth',.06,.15)},
  good(){this.tone(660,.1,'triangle',.08);this.tone(990,.16,'triangle',.08,.08)},
  thud(){this.tone(80,.3,'square',.14)}, drop(){this.tone(500,.4,'sine',.06);this.tone(300,.4,'sine',.05,.12)}
};

/* ================= 存檔 ================= */
const Save={
  key:i=>'adhdlife_slot_'+i,
  load(i){try{const s=localStorage.getItem(this.key(i));return s?normalizeSave(JSON.parse(s)):null}catch(e){return null}},
  store(i,d){try{d.savedAt=Date.now();localStorage.setItem(this.key(i),JSON.stringify(d));return true}catch(e){return false}},
  encode(d){return 'ADHD1:'+btoa(unescape(encodeURIComponent(JSON.stringify(d))))},
  decode(s){try{s=String(s).trim();if(!s.startsWith('ADHD1:'))return null;const d=JSON.parse(decodeURIComponent(escape(atob(s.slice(6)))));return validSave(d)?normalizeSave(d):null}catch(e){return null}}
};

const MAPS={};
function getMap(n){if(!MAPS[n])MAPS[n]=n==='home'?buildHome():buildSchool();return MAPS[n]}
function solidAt(m,tx,ty){if(tx<0||ty<0||tx>=m.w||ty>=m.h)return true;if(SOLID_BASE.includes(m.base[ty][tx]))return true;const o=m.obj[ty][tx];return !!o&&o!=='c'}
const tc=(t)=>t*T+8;              // 格子中心 x
const tf=(t)=>t*T+12;             // 格子內腳的位置 y
function bfs(m,sx,sy,gx,gy){
  if(solidAt(m,gx,gy))return null;
  const key=(x,y)=>y*m.w+x,prev=new Map([[key(sx,sy),-1]]),q=[[sx,sy]];
  while(q.length){const [x,y]=q.shift();if(x===gx&&y===gy)break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(prev.has(k)||solidAt(m,nx,ny))continue;prev.set(k,key(x,y));q.push([nx,ny])}}
  if(!prev.has(key(gx,gy)))return null;
  const path=[];let k=key(gx,gy);while(k!==-1&&k!==key(sx,sy)){path.unshift([k%m.w,Math.floor(k/m.w)]);k=prev.get(k)}return path;
}

const POOL={
  general:['晚餐會不會吃咖哩？','昨天那集卡通後來怎樣了？','如果我會飛就好了','橡皮擦可以切成幾塊？','窗外那朵雲好像一隻狗','我的寶可夢卡放哪了？','為什麼天空是藍的？','好想吃冰','等一下下課要玩什麼？','鞋帶好像鬆了','恐龍跟鯊魚誰比較強？','好想養一隻倉鼠'],
  body:['好想站起來跑一圈！','腳好癢，好想動','敲桌子的聲音好好聽','椅子往後翹翹看？','手好想轉東西'],
  self:['剛剛那句話是不是講錯了…','大家會不會覺得我很笨？','要假裝在聽才不會被發現','為什麼別人都做得到？','我是不是又搞砸了…'],
};
class Brain{
  constructor(p,typical){
    this.typical=typical;this.g=p.gender;this.iq=p.iq;
    this.comp=clamp((p.iq-100)/40,-.5,1);
    this.memCap=typical?4:(p.iq>=125?3:2);
    this.focus=typical?85:70;this.dopa=typical?70:55;this.rest=0;this.mood=70;this.anx=typical?5:15;
    this.notes=[];this.thoughts=[];this.hyper=false;this.daydream=0;this.tCount=0;this.nid=1;this.on=()=>{};
  }
  get masking(){return !this.typical&&this.g==='F'}
  emit(t,d){try{this.on(t,d)}catch(e){console.error(e)}}
  addNotes(list){
    const dropped=[];
    for(const it of list){
      if(this.notes.some(n=>n.key===it.key&&!n.done)){continue}
      if(this.notes.filter(n=>!n.done).length<this.memCap)this.notes.push({id:this.nid++,key:it.key,text:it.text,life:1,cd:0,done:false});
      else dropped.push(it);
    }
    if(dropped.length)this.emit('overflow-notes',dropped);
    return dropped;
  }
  hasNote(k){return this.notes.some(n=>n.key===k&&!n.done)}
  completeNote(k){const n=this.notes.find(n=>n.key===k&&!n.done);if(n){n.done=true;n.doneT=.9}return !!n}
  clearNotes(){this.notes=[]}
  refresh(id){const n=this.notes.find(n=>n.id===id);if(!n||n.done||n.cd>0)return false;n.life=Math.min(1,n.life+.45);n.cd=6;this.focus=Math.max(0,this.focus-3);return true}
  rate(c){
    if(this.hyper||this.daydream>0)return 0;
    let r=this.typical?.035:(this.g==='F'?.24:.2);
    r*=(c.dist==null?1:c.dist);if(this.dopa<30)r*=1.7;if(c.interesting)r*=.3;if(c.noThoughts)r=0;
    return r;
  }
  update(dt,c){
    const A=!this.typical;
    if(A&&c.interesting&&this.dopa>72&&!this.hyper){this.hyper=true;this.thoughts.forEach(t=>t.gone=true);this.emit('hyper',true)}
    if(this.hyper&&!c.interesting){this.hyper=false;this.emit('hyper',false)}
    let dd=0;
    if(c.interesting)dd+=A?6:2.5;else if(c.working&&c.boring)dd-=A?1.6:.5;
    if(c.walking)dd+=A?1.5:.3;if(c.fidget)dd+=A?1.2:.2;
    if(!c.working&&!c.interesting)dd+=(50-this.dopa)*.04;
    this.dopa=clamp(this.dopa+dd*dt,0,100);
    let target=this.typical?85:clamp(30+this.dopa*.5+this.comp*8-(this.rest>70?10:0),15,88);
    if(this.hyper)target=100;
    this.focus=clamp(this.focus+(target-this.focus)*Math.min(1,dt*.8),0,100);
    if(c.seated)this.rest+=(this.typical?.4:(this.g==='M'?3:2))*(c.restMul||1)*dt;
    if(c.walking)this.rest-=12*dt;
    if(c.fidget)this.rest-=(A?9:6)*dt;
    if(!c.seated&&!c.walking)this.rest-=2*dt;
    if(this.hyper)this.rest-=3*dt;
    this.rest=clamp(this.rest,0,100);
    if(this.rest>=100&&c.seated){this.rest=60;this.emit('rest-overflow')}
    if(this.masking&&c.seated&&this.rest>55)this.anx=clamp(this.anx+.6*dt,0,100);else this.anx=clamp(this.anx-.15*dt,0,100);
    for(const n of this.notes){
      if(n.cd>0)n.cd-=dt;
      if(n.done){n.doneT-=dt;continue}
      if(A)n.life-=.016*(1-.35*this.comp)*(this.focus<40?1.6:1)*(this.hyper?.3:1)*dt;
    }
    for(const n of this.notes.filter(n=>!n.done&&n.life<=0)){this.emit('note-lost',n)}
    this.notes=this.notes.filter(n=>n.done?n.doneT>0:n.life>0);
    if(this.daydream>0)this.daydream-=dt;
    const max=A?3:1;
    if(this.thoughts.filter(t=>!t.gone).length<max&&Math.random()<this.rate(c)*dt)this.spawn(c);
    for(const t of this.thoughts){
      if(t.gone)continue;t.age+=dt;
      if(this.typical){if(t.age>1.2)t.gone=true;continue}
      if(t.age>=t.max){t.gone=true;this.emit('hijack',t)}
    }
    this.thoughts=this.thoughts.filter(t=>!t.gone||t.keep>0);
    this.thoughts.forEach(t=>{if(t.gone)t.keep-=dt});
  }
  spawn(c){
    let tpl=null;for(let i=0;i<4;i++){tpl=(c.source&&c.source(this))||{text:pick(POOL.general),kind:'general'};if(!this.thoughts.some(t=>!t.gone&&t.text===tpl.text))break;tpl=null}
    if(!tpl)return;
    this.tCount++;
    this.thoughts.push({id:this.nid++,text:tpl.text,kind:tpl.kind||'general',lure:tpl.lure||null,age:0,max:(tpl.lure?4.2:5)+this.comp*1.2,gone:false,keep:.3,x:rand(4,52),y:rand(18,58)});
  }
  dismiss(id){const t=this.thoughts.find(t=>t.id===id&&!t.gone);if(!t)return false;t.gone=true;t.popped=true;this.focus=Math.max(0,this.focus-2);return true}
}

/* ---------- 座位任務共用 ---------- */
function seatWork(dt,rate){
  const b=G.brain;
  if(rate>0&&input.write&&b.daydream<=0){
    const mul=(.35+.65*b.focus/100)*(b.dopa<25?.6:1)*(1+.15*b.comp);
    G.prog=clamp(G.prog+rate*mul*dt,0,100);
  }
  const pb=$('#pbar');if(pb&&rate>0){pb.style.width=G.prog+'%';$('#plbl').textContent='完成 '+Math.round(G.prog)+'%'+(G.compare?'　｜　一般的你 '+Math.round(G.gprog)+'%':'')}
}
function ghostWork(dt,rate){G.gprog=clamp(G.gprog+rate*.97*dt,0,100)}
function addLabPt(){
  const lab=$('#lab'),el=document.createElement('div');el.className='pt';el.textContent='🔍';
  const p={t:G.brain.hyper?3:2.2,el};el.style.left=rand(12,88)+'%';el.style.top=rand(18,85)+'%';
  el.addEventListener('pointerdown',e=>{e.stopPropagation();if(G.paused||G.dlg)return;G.lab.score+=1;Sound.pop();p.t=0;el.remove()});
  lab.appendChild(el);G.lab.pts.push(p);
}
function startQTE(){
  const A=G.save.gender==='M'?2.2:1.8;
  G.qte={t:0,win:3.2,need:A,prog:0};
  $('#qteQ').textContent='老師：「7×8 等於多少？想好的人先舉手——」\n你腦中已經衝出答案了！';
  $('#qteHint').textContent='提示：「坐不住」越高，煞車越難踩。';
  $('#qte').style.display='block';
}
async function endQTE(ok){
  $('#qte').style.display='none';input.hold=false;G.qte=null;
  if(ok){S().qteOk=true;G.brain.mood=clamp(G.brain.mood+5,0,100);Sound.good();await say('老師','{name}有舉手，很好。答案是？\n——「56！」答對了！')}
  else{S().blurts++;await say('你','「五十六——！！」（還沒舉手就喊出來了）');await scold('老師','{name}，要先舉手！不要用喊的！')}
}

/* ================= 流程控制 ================= */
function chapterDef(id){return id==='elem'?CH_ELEM:null}
function setStageMode(kind){
  const touch=isTouch();
  $('#pad').style.display=(kind==='roam'&&touch)?'block':'none';
  $('#actBtn').style.display=(kind==='roam'&&touch)?'block':'none';
  $('#seatbar').style.display=kind==='seat'?'block':'none';
}
function refreshBar(){if(G.seg&&G.seg.bar){$('#seatbar').innerHTML=G.seg.bar();bindHoldButtons($('#seatbar'))}}
function startChapter(id,segIdx){
  G.chapter=chapterDef(id);if(!G.chapter)return;
  const sv=G.save;
  G.brain=new Brain(sv,false);G.gb=new Brain(sv,true);G.brain.on=onBrain;G.gb.on=onGhostBrain;
  if(sv.run&&sv.run.chapter===id&&segIdx>0){G.run=sv.run.state;G.brain.mood=sv.run.mood??70;G.brain.anx=sv.run.anx??15}
  else{G.run=newRun();segIdx=0}
  // 舊存檔補欄位
  const fresh=newRun();G.run.stats=Object.assign(fresh.stats,G.run.stats||{});G.run.gs=Object.assign(fresh.gs,G.run.gs||{});G.run.bag=G.run.bag||{};G.run.flags=G.run.flags||{};
  showSegCard(segIdx);
}
function autosave(){
  const sv=G.save;sv.chapter=G.chapter.id;sv.seg=G.segIndex;
  sv.run={chapter:G.chapter.id,state:JSON.parse(JSON.stringify(G.run)),mood:G.brain.mood,anx:G.brain.anx};
  Save.store(G.slot,sv);
}
function showSegCard(i){
  G.segIndex=i;G.running=false;const seg=G.chapter.segs[i];
  autosave();
  let extra='';if(seg.id==='copy'&&S().late)extra='<p class="warn">你遲到了。</p>';
  screen(`<div class="scr cardtime"><div class="tm">${seg.t0}</div><div class="tt">${esc(seg.title)}</div><p>${esc(seg.card)}</p>${extra}<button class="mbtn pri" id="goSeg" style="margin-top:30px">開始</button><p style="font-size:13px;color:var(--sub)">${esc(G.chapter.name)}・${G.chapter.age}　｜　已自動存檔</p></div>`);
  $('#goSeg').onclick=()=>{Sound.init();hideScreen();beginSeg(i)};

function beginSeg(i){
  const seg=G.chapter.segs[i];G.seg=seg;G.segT=0;G.timers=[];G.fast=false;G.seated=false;G.qte=null;G.distract=null;G.peek=0;
  G.map=getMap(seg.map);G.ents=[];G.npcs=[];
  if(!seg.keepNotes){G.brain.clearNotes();G.gb.clearNotes()}
  G.brain.thoughts=[];G.gb.thoughts=[];G.brain.daydream=0;G.brain.hyper=false;G.brain.rest=Math.min(G.brain.rest,30);
  // 換時段＝休息過：動力與專注部分回復（不完全回滿）
  for(const bb of [G.brain,G.gb]){const base=bb.typical?70:55;bb.dopa=Math.max(bb.dopa,lerp(bb.dopa,base,.8));bb.focus=Math.max(bb.focus,bb.typical?85:60)}
  $('#daydream').style.display='none';$('#hyperTag').style.display='none';$('#cloudMe').querySelectorAll('.bub').forEach(e=>e.remove());
  seg.setup();
  G.ents.forEach(e=>{e.px=tc(e.tx);e.py=e.onDesk?e.ty*T+6:tf(e.ty)-4});
  G.clock=hm(seg.t0);
  setStageMode(seg.kind);refreshBar();
  G.running=true;G.paused=false;
  Promise.resolve(seg.begin&&seg.begin()).catch(e=>console.error(e));
}
let ending=false;
async function endSeg(){
  if(ending||!G.running)return;ending=true;
  try{
    G.running=false;input.write=input.fidget=input.hold=false;
    const seg=G.seg;if(seg.finish)await seg.finish();
    $('#seatbar').style.display='none';$('#lab').style.display='none';$('#qte').style.display='none';$('#daydream').style.display='none';
    // ghost 帶的東西
    const next=G.segIndex+1;
    if(next<G.chapter.segs.length)showSegCard(next);
    else finishChapter();
  }finally{ending=false}
}
async function timeUp(){
  const seg=G.seg;G.running=false;
  if(seg.onTimeUp){G.running=true;G.clockFrozen=true;await seg.onTimeUp();G.clockFrozen=false;if(G.running&&G.seg===seg)endSeg()}
  else{G.running=true;endSeg()}
}

const input={up:0,down:0,left:0,right:0,write:false,fidget:false,hold:false,act:false};
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
function isTouch(){return matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0}
addEventListener('keydown',e=>{
  if($('#screen').style.display==='block'&&e.target.tagName!=='BODY')return;
  if(KEYMAP[e.code]){input[KEYMAP[e.code]]=1;e.preventDefault()}
  if(e.code==='Space'||e.code==='KeyE'||e.code==='Enter'){
    e.preventDefault();if(e.repeat)return;
    if(G.dlg){advanceDlg();return}
    if(G.qte){input.hold=true;return}
    if(G.seg&&G.seg.kind==='seat')input.write=true;else interact();
  }
  if(e.code==='KeyF')input.fidget=true;
  if(e.code==='KeyC'&&G.running)toggleCompare();
  if(e.code==='Escape')pauseMenu();
});
addEventListener('keyup',e=>{
  if(KEYMAP[e.code])input[KEYMAP[e.code]]=0;
  if(e.code==='Space'||e.code==='KeyE'||e.code==='Enter'){input.write=false;input.hold=false}
  if(e.code==='KeyF')input.fidget=false;
});
addEventListener('blur',()=>{for(const k in input)input[k]=typeof input[k]==='boolean'?false:0});
function bindHoldButtons(root){
  root.querySelectorAll('[data-hold]').forEach(b=>{
    const k=b.dataset.hold;
    const on=e=>{e.preventDefault();Sound.init();input[k]=true;b.classList.add('held')};
    const off=()=>{input[k]=false;b.classList.remove('held')};
    b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,off));
    b.addEventListener('contextmenu',e=>e.preventDefault());
  });
  root.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{if(G.dlg||G.paused)return;Sound.blip();G.seg.act&&G.seg.act(b.dataset.act,b.dataset.v)}));
}
bindHoldButtons($('#qte'));
document.querySelectorAll('#pad [data-dir]').forEach(b=>{const k=b.dataset.dir;
  b.addEventListener('pointerdown',e=>{e.preventDefault();input[k]=1});['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>input[k]=0))});
$('#actBtn').addEventListener('pointerdown',e=>{e.preventDefault();if(G.dlg){advanceDlg();return}interact()});
$('#hudClock').addEventListener('click',()=>{if(!G.running)return;G.peek=3;S().peeks++});
$('#btnCmp').addEventListener('click',toggleCompare);
$('#btnMenu').addEventListener('click',pauseMenu);
$('#btnFull').addEventListener('click',()=>{
  const d=document,el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
  else{const f=el.requestFullscreen||el.webkitRequestFullscreen;if(f)f.call(el);else toast('iPhone 不支援全螢幕：請用 Safari「分享 → 加入主畫面」')}
});
function toggleCompare(){G.compare=!G.compare;$('#btnCmp').classList.toggle('on',G.compare);$('#colGh').style.display=G.compare?'block':'none';
  $('#colMe .ctitle').textContent=G.compare?'你（ADHD）':'你（ADHD）'}

/* ================= 互動 ================= */
function nearestInteract(){
  const p=G.player;if(!p||!G.seg||G.seg.kind!=='roam'||p.auto)return null;
  let best=null,bd=27;
  for(const e of G.ents){if(e.gone||e.nointeract||e.trigger)continue;const d=dist(p.x,p.y-6,e.px,e.onDesk?e.py+4:e.py-2);if(d<bd){bd=d;best=e}}
  if(G.seated)return null;return best;
}
function interact(){
  if(!G.running||G.paused||G.dlg)return;const e=nearestInteract();if(!e)return;
  if(e.item){e.gone=true;G.run.bag[e.id]=true;const had=G.brain.completeNote(e.id);Sound.good();toast('拿到「'+e.name+'」');if(!had)inner('啊！這個也要帶！差點忘了');return}
  G.seg.onTalk&&G.seg.onTalk(e);
}

/* ================= 主迴圈 ================= */
function step(dt){
  updateBrainUI(dt);
  if(!G.running||G.paused||$('#screen').style.display==='block')return;
  if(G.dlg)return;
  const seg=G.seg;
  // 計時器
  G.segT+=dt;
  for(const t of G.timers){t.t-=dt;if(t.t<=0&&!t.done){t.done=true;t.fn()}}
  G.timers=G.timers.filter(t=>!t.done);
  if(G.dlg)return;
  if(G.peek>0)G.peek-=dt;
  if(G.innerT>0){G.innerT-=dt;if(G.innerT<=0)$('#innerMe').textContent=''}
  // 時間
  if(seg.kind!=='scene'&&!G.clockFrozen){
    const rate=(hm(seg.t1)-hm(seg.t0))/seg.real*(G.fast?5:1);
    G.clock+=rate*dt;
    if(G.clock>=hm(seg.t1)){G.clock=hm(seg.t1);timeUp();return}
  }
  // QTE
  if(G.qte){const q=G.qte;q.t+=dt;const r=1-G.brain.rest/150;
    if(input.hold)q.prog+=dt*r;else q.prog=Math.max(0,q.prog-dt*.6);
    $('#qteP').style.width=clamp(q.prog/q.need*100,0,100)+'%';$('#qteT').style.width=clamp((1-q.t/q.win)*100,0,100)+'%';
    $('#qteBtn').classList.toggle('held',input.hold);
    if(q.prog>=q.need)endQTE(true);else if(q.t>=q.win)endQTE(false);
  }
  // 玩家移動
  let walking=false;
  if(seg.kind==='roam'&&G.player&&!G.seated){
    const p=G.player;
    if(p.auto){
      const a=p.auto;
      if(a.t>0&&dist(p.x,p.y,a.x,a.y)>10){const ox=p.x,oy=p.y;moveActor(p,a.x-p.x,a.y-p.y,dt,62);walking=true;a.t-=dt;if(Math.hypot(p.x-ox,p.y-oy)<.2){a.stuck+=dt;if(a.stuck>.5)a.t=0}}
      else{a.t=0;a.stay-=dt;p.moving=false;if(a.stay<=0)p.auto=null}
    }else{
      const dx=input.right-input.left,dy=input.down-input.up;
      if(dx||dy){moveActor(p,dx,dy,dt,72);walking=true}else p.moving=false;
      // 觸發
      const ptx=Math.floor(p.x/T),pty=Math.floor((p.y-2)/T);
      for(const e of G.ents){if(e.trigger&&!e.fired&&e.tx===ptx&&e.ty===pty){e.fired=true;Promise.resolve(seg.onTrigger&&seg.onTrigger(e)).then(()=>{setTimeout(()=>e.fired=false,800)})}}
    }
  }
  // 一般人分身
  if(seg.kind==='roam')ghostStep(dt);
  // NPC / 貓
  for(const n of G.npcs){if(n.orbit){const o=n.orbit;o.ph+=dt*o.sp;const nx=o.cx+Math.cos(o.ph)*o.r,ny=o.cy+Math.sin(o.ph)*o.r*.6;n.dir=Math.abs(nx-n.x)>Math.abs(ny-n.y)?(nx>n.x?'right':'left'):(ny>n.y?'down':'up');n.x=nx;n.y=ny;n.anim=(n.anim||0)+dt*8}}
  for(const e of G.ents){if(e.wander&&!e.gone){e.wt=(e.wt||0)-dt;if(e.wt<=0){e.wt=rand(1.5,3);e.vx=rand(-14,14);e.vy=rand(-8,8)}const nx=e.px+e.vx*dt,ny=e.py+e.vy*dt;if(!solidAt(G.map,Math.floor(nx/T),Math.floor((ny+4)/T))&&nx>tc(8)&&nx<tc(20)){e.px=nx;e.py=ny}else{e.vx*=-1;e.vy*=-1}}
    if(e.orbitBall){const k=G.npcs.find(n=>n.orbit);if(k){e.px=k.x+8;e.py=k.y+2}}}
  // 大腦
  const fid=input.fidget&&seg.kind==='seat';
  const working=seg.kind==='seat'&&(input.write||seg.interesting);
  const inPlay=G.player&&G.map.name==='school'&&G.player.y<tf(11)&&G.player.x>tc(19.5);
  G.inPlayground=inPlay;
  const labOn=seg.id!=='lab'||!G.lab||(G.lab.on&&!G.lab.warned);
  const c={seated:seg.kind==='seat'||G.seated,working:working||G.seated,fidget:fid,walking,boring:!!seg.boring,interesting:(!!seg.interesting&&labOn)||inPlay,dist:seg.dist,restMul:seg.restMul,source:thoughtSource,noThoughts:!!G.qte||seg.kind==='scene'};
  G.brain.update(dt,c);
  G.gb.update(dt,{seated:c.seated,working:seg.kind==='seat',fidget:false,walking:seg.kind==='roam',boring:c.boring,interesting:!!seg.interesting&&labOn,dist:c.dist,restMul:c.restMul,noThoughts:seg.kind==='scene'});
  if(G.brain.daydream<=0)$('#daydream').style.display='none';
  if(G.distract){G.distract.t-=dt;if(G.distract.t<=0)G.distract=null}
  seg.tick&&seg.tick(dt);
}
function moveActor(a,dx,dy,dt,sp){
  const l=Math.hypot(dx,dy);if(!l){a.moving=false;return}dx/=l;dy/=l;
  const nx=a.x+dx*sp*dt,ny=a.y+dy*sp*dt;
  if(!collide(nx,a.y))a.x=nx;if(!collide(a.x,ny))a.y=ny;
  a.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');a.moving=true;a.anim=(a.anim||0)+dt*8;
}
function collide(x,y){return [[x-4,y-4],[x+4,y-4],[x-4,y],[x+4,y]].some(([px,py])=>solidAt(G.map,Math.floor(px/T),Math.floor(py/T)))}
function ghostStep(dt){
  const g=G.ghost;if(!g||g.done)return;
  if(g.wait>0){g.wait-=dt;g.moving=false;return}
  if(!g.path){
    const tgt=g.plan[0];if(!tgt){g.done=true;g.moving=false;return}
    g.path=bfs(G.map,Math.floor(g.x/T),Math.floor((g.y-2)/T),tgt[0],tgt[1])||[];
  }
  if(!g.path.length){const tgt=g.plan.shift();g.path=null;g.wait=.8;if(tgt&&tgt[2])G.gb.completeNote(tgt[2]);if(tgt&&tgt[2]==='seat'){g.sit=true;g.dir='up'}return}
  const [nx,ny]=g.path[0];const tx=tc(nx),ty=tf(ny);
  const dx=tx-g.x,dy=ty-g.y,d=Math.hypot(dx,dy),sp=60*dt;
  if(d<=sp){g.x=tx;g.y=ty;g.path.shift()}else{g.x+=dx/d*sp;g.y+=dy/d*sp}
  g.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');g.moving=true;g.anim=(g.anim||0)+dt*8;
}

/* ================= 繪圖 ================= */
const cv=$('#cv'),ctx=cv.getContext('2d');
let VW=0,VH=0,DPR=1,Z=3;
function resize(){
  const r=$('#stage').getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);
  VW=r.width;VH=r.height;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  Z=Math.max(2,Math.floor(Math.min(VW/(T*15),VH/(T*10))));
}
addEventListener('resize',resize);
function render(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#1b1f30';ctx.fillRect(0,0,cv.width,cv.height);
  if(!G.map||!G.player){return}
  const m=G.map,p=G.player,s=Z*DPR;
  const viewW=VW/Z,viewH=VH/Z;
  let camX=p.x-viewW/2,camY=p.y-8-viewH/2;
  const mw=m.w*T,mh=m.h*T;
  camX=mw<=viewW?(mw-viewW)/2:clamp(camX,0,mw-viewW);camY=mh<=viewH?(mh-viewH)/2:clamp(camY,0,mh-viewH);
  camX=Math.round(camX*Z)/Z;camY=Math.round(camY*Z)/Z;
  ctx.setTransform(s,0,0,s,-camX*s,-camY*s);ctx.imageSmoothingEnabled=false;
  const x0=Math.max(0,Math.floor(camX/T)),y0=Math.max(0,Math.floor(camY/T)),x1=Math.min(m.w-1,Math.ceil((camX+viewW)/T)),y1=Math.min(m.h-1,Math.ceil((camY+viewH)/T));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const b=m.base[y][x];let under=b;
    ctx.drawImage(baseTile(under,x,y),x*T,y*T);
  }
  // 物件與角色依 y 排序
  const list=[];
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const o=m.obj[y][x];if(o)list.push({y:y*T+(o==='c'?2:12),f:()=>{
    if(o==='b'){const top=!(m.obj[y-1]&&m.obj[y-1][x]==='b');ctx.drawImage(objTile('b',top),x*T,y*T)}else ctx.drawImage(objTile(o,0),x*T,y*T)}})}
  const tt=t/1000;
  for(const e of G.ents){if(e.gone||e.kind==='none')continue;list.push({y:e.onDesk?e.py+8:e.py+6,f:()=>drawItemIcon(ctx,e.kind,Math.round(e.px-8),Math.round(e.py-8),tt)})}
  // 被吸引物發光
  const lureIds=new Set(G.brain?G.brain.thoughts.filter(x=>!x.gone&&x.lure).map(x=>x.lure):[]);
  for(const e of G.ents){if(lureIds.has(e.id)){list.push({y:9999,f:()=>{ctx.strokeStyle='rgba(255,230,90,'+(.5+.5*Math.sin(tt*8))+')';ctx.lineWidth=1;ctx.strokeRect(Math.round(e.px-9),Math.round(e.py-12),18,18)}})}}
  for(const n of G.npcs){list.push({y:n.y,f:()=>drawChar(ctx,n.x,n.y,n.look,{dir:n.dir,sit:n.sit,moving:n.moving,frame:n.anim})})}
  if(G.compare&&G.ghost&&G.seg.kind!=='scene'){const g=G.ghost;list.push({y:g.y+.1,f:()=>{drawChar(ctx,g.x,g.y,meLook(),{dir:g.dir,sit:g.sit,moving:g.moving,frame:g.anim,alpha:.45});
    ctx.fillStyle='rgba(111,224,224,.95)';ctx.font='bold 5px sans-serif';ctx.textAlign='center';ctx.fillText('一般的你',g.x,g.y-20)}})}
  list.push({y:p.y,f:()=>drawChar(ctx,p.x,p.y,meLook(),{dir:p.dir,sit:p.sit,moving:p.moving,frame:p.anim})});
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  // 聚光燈（注意力）
  if(G.brain&&G.seg&&G.seg.kind!=='scene'){
    const b=G.brain;let cx=(p.x-camX)*Z,cy=(p.y-10-camY)*Z;
    if(G.distract){cx=lerp(cx,(G.distract.x-camX)*Z,.7);cy=lerp(cy,(G.distract.y-camY)*Z,.7)}
    const big=Math.max(VW,VH);const r=b.hyper?big*.16:lerp(big*.14,big*.7,b.focus/100);
    const dark=b.hyper?.78:lerp(.72,.05,b.focus/100);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const gr=ctx.createRadialGradient(cx,cy,r*.35,cx,cy,r);gr.addColorStop(0,'rgba(20,22,40,0)');gr.addColorStop(1,'rgba(20,22,40,'+dark+')');
    ctx.fillStyle=gr;ctx.fillRect(0,0,VW,VH);
    if(b.hyper){ctx.fillStyle='rgba(255,200,80,.08)';ctx.fillRect(0,0,VW,VH)}
  }
  // 互動提示
  const e=nearestInteract(),pr=$('#prompt');
  if(e&&!G.dlg){pr.style.display='block';pr.style.left=((e.px-camX)*Z)+'px';pr.style.top=((e.py-14-camY)*Z)+'px';
    pr.textContent=(isTouch()?'動作：':'E：')+(e.item?'拿起「'+e.name+'」':(e.label||e.name))}
  else pr.style.display='none';
}

/* ================= 大腦面板 UI ================= */
const METERS=[['focus','專注力','#f0b84a'],['dopa','動力','#7fd08a'],['rest','坐不住','#ef7a6a'],['mood','心情','#7fb8e8'],['anx','焦慮','#b58ae8']];
function buildMeters(el){el.innerHTML=METERS.map(([k,n,c])=>`<div class="meter" data-k="${k}"><span class="n">${n}</span><span class="b"><i style="background:${c}"></i></span><span class="v"></span></div>`).join('')}
buildMeters($('#metersMe'));buildMeters($('#metersGh'));
let uiAcc=0;
function updateBrainUI(dt){
  const b=G.brain,g=G.gb;if(!b)return;
  // 時鐘
  const ct=$('#clockT'),cs=$('#clockS');
  if(G.seg&&G.seg.kind!=='scene'){
    const exact=G.peek>0;
    if(exact){ct.textContent=fmtTime(G.clock);ct.className='t'}
    else{ct.className='t fuzzy';ct.textContent=fuzzyClock()}
    cs.textContent=(exact?'':'👆點我看時鐘　')+G.seg.title+(G.compare?'　｜一般的你：'+fmtTime(G.clock):'');
  }else{ct.textContent=G.seg?G.seg.t0:'--:--';ct.className='t';cs.textContent=G.seg?G.seg.title:''}
  // 泡泡
  const cloud=$('#cloudMe');
  $('#hyperMe').style.display=b.hyper?'flex':'none';
  const seen=new Set();
  for(const t of b.thoughts){
    let el=cloud.querySelector('[data-id="'+t.id+'"]');
    if(t.gone){if(el&&!el.classList.contains('pop')){el.classList.add('pop');setTimeout(()=>el.remove(),260)}continue}
    seen.add(String(t.id));
    if(!el){el=document.createElement('div');el.className='bub '+t.kind;el.dataset.id=t.id;el.style.left=t.x+'%';el.style.top=t.y+'%';el.innerHTML=esc(t.text)+'<i></i>';
      el.addEventListener('pointerdown',ev=>{ev.preventDefault();if(G.paused||G.dlg)return;if(b.dismiss(t.id)){Sound.pop()}});cloud.appendChild(el)}
    el.querySelector('i').style.transform='scaleX('+clamp(1-t.age/t.max,0,1)+')';
  }
  cloud.querySelectorAll('.bub:not(.pop)').forEach(el=>{if(!seen.has(el.dataset.id))el.remove()});
  uiAcc+=dt;if(uiAcc<.1)return;uiAcc=0;
  $('#bpInfo').textContent=`ADHD 混合型・${G.save.gender==='M'?'男':'女'}・IQ ${G.save.iq}`;
  renderNotes($('#notesMe'),b,false);$('#capMe').textContent='格數 '+b.memCap;
  renderMeters($('#metersMe'),b);
  if(G.compare){renderNotes($('#notesGh'),g,true);$('#capGh').textContent='格數 '+g.memCap;renderMeters($('#metersGh'),g);
    $('#gcount').textContent='今天冒出 '+g.tCount+' 個念頭，都自己消失了。\n（你：'+b.tCount+' 個）';
    $('#gprog').textContent=G.seg&&G.seg.kind==='seat'&&G.seg.boring?'任務進度 '+Math.round(G.gprog)+'%':''}
}
function fuzzyClock(){
  const b=G.brain,seg=G.seg;if(!b||!seg)return '';
  if(b.hyper)return '時間？什麼時間？';
  if(G.inPlayground)return '還很久～';
  const rem=(hm(seg.t1)-G.clock)/(hm(seg.t1)-hm(seg.t0));
  if(rem>.6)return '還很久～';if(rem>.3)return '應該還有時間？';return '好像……快了？';
}
function renderNotes(el,b,ghost){
  const keep=[...el.querySelectorAll('.fall')];
  const html=b.notes.map(n=>`<div class="note ${n.done?'done':''}" data-id="${n.id}" style="opacity:${n.done?1:clamp(.25+n.life,.25,1)}">${esc(n.done?n.text:degrade(n.text,n.life))}${!ghost&&!n.done&&n.life<.7&&n.cd<=0?' 👆':''}</div>`).join('')
    +Array(Math.max(0,b.memCap-b.notes.length)).fill('<div class="note empty">（空）</div>').join('');
  if(el._h!==html){el._h=html;el.innerHTML=html;keep.forEach(k=>el.appendChild(k));
    if(!ghost)el.querySelectorAll('.note[data-id]').forEach(n=>n.addEventListener('pointerdown',e=>{e.preventDefault();if(b.refresh(+n.dataset.id)){Sound.blip();toast('在心裡默念一次……');el._h=''}}))}
}
function fallNote(text){const el=$('#notesMe'),d=document.createElement('div');d.className='note fall';d.textContent=text;el.appendChild(d);setTimeout(()=>d.remove(),1300)}
function renderMeters(el,b){
  el.querySelectorAll('.meter').forEach(m=>{const k=m.dataset.k;const v=Math.round(b[k]);
    if(k==='anx'&&!b.masking&&!b.typical&&b.anx<25){m.style.display='none';return}
    if(k==='anx'&&b.typical){m.style.display=G.save.gender==='F'?'flex':'none'}else m.style.display='flex';
    m.querySelector('i').style.width=v+'%';m.querySelector('.v').textContent=v});
}

/* ================= 啟動 ================= */
let last=performance.now();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;try{step(dt);render(now)}catch(e){console.error(e)}requestAnimationFrame(frame)}
$('#ver').textContent=VERSION;
resize();titleScreen();requestAnimationFrame(frame);
window.__adhd={G,step,input,Save,CH_ELEM,endSeg,beginSeg,startChapter};
</script>
